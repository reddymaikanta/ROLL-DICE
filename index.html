<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
     <link rel="stylesheet" href="style.css">
   
</head>
<body>
    
<div class="game-card">

    <div class="header">
        <div>
            <div class="title">🎲 Dice Master</div>    
            <div class="subtitle">Roll the dice and beat your score!</div>
        </div>

        <button class="theme-btn" id="themeBtn">🌙</button>
    </div>

    <!-- Score Board -->
    <div class="score-board">

        <div class="score-box">
            <small>SCORE</small>
            <strong id="score">0</strong>
        </div>

        <div class="score-box">
            <small>ROLLS</small>
            <strong id="rolls">0</strong>
        </div>

        <div class="score-box">
            <small>BEST</small>
            <strong id="best">0</strong>
        </div>

    </div>

    <!-- Dice -->
    <div class="dice-area">

        <div class="dice face-1" id="dice">
            <div class="pip"></div>
        </div>

    </div>

    <!-- Result -->
    <div class="result" id="result">
        Click Roll Dice to start!
    </div>

    <!-- Buttons -->
    <div class="buttons">

        <button class="roll-btn" id="rollBtn">
            🎲 Roll Dice
        </button>

        <button class="reset-btn" id="resetBtn">
            🔄 Reset
        </button>

    </div>

    <!-- History -->
    <div class="history">

        <div class="history-title">
            <h3>Roll History</h3>
            <button class="clear-btn" id="clearBtn">
                Clear
            </button>
        </div>

        <div class="history-list" id="historyList"></div>

    </div>

    <div class="hint">
        Press <b>Spacebar</b> or click the dice to roll
    </div>

</div>



<script src="script.js"></script>
</body>
</html>
